bundle:
  name: openelec
  # Direct engine avoids downloading the Terraform binary from
  # releases.hashicorp.com, which Free Edition's serverless egress allowlist
  # blocks (confirmed via community reports of exactly this failure). Also
  # required for Genie space resources later. Start on direct rather than
  # migrating an existing Terraform-state bundle onto it.
  engine: direct
  databricks_cli_version: '>=1.23.0'

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog for this project
    default: openelec
  warehouse_id:
    description: >-
      SQL warehouse backing the Genie space (Free Edition: one shared 2X-Small).
      Found via `dbx warehouses list` — see docs/genie-spec.md G0.
    default: <warehouse-id>
  lakebase_branch:
    description: >-
      Lakebase branch that holds the synced tables (resources/lakebase.yml), as
      `projects/<project_id>/branches/<branch_id>`. The project itself is created once
      outside the bundle; if yours has a different ID, override with
      `--var lakebase_branch=projects/<id>/branches/<branch>`.
      See lakebase/README.md.
    default: projects/openelec/branches/production

targets:
  dev:
    default: true
    mode: development
